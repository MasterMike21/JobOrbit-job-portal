<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/joborbit-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobOrbit | Explore & Apply to Top Tech Jobs</title>
    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
          if (!savedTheme) localStorage.setItem('theme', 'dark');
        }
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-[#0b0f19] text-gray-900 dark:text-gray-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
